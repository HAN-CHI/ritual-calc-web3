<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祭祀期日演算系統 - 專業聯網版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入專業農曆庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(180, 150, 80, 0.2); backdrop-filter: blur(12px); }
        .text-gold { color: #d4af37; }
        .bg-gold { background-color: #d4af37; }
        .date-font { font-family: 'Courier New', Courier, monospace; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; }
    </style>
</head>
<body class="antialiased">

<div class="min-h-screen flex flex-col items-center py-10 px-4">
    <!-- Header -->
    <header class="max-w-2xl w-full text-center mb-10">
        <h1 class="text-4xl font-900 tracking-[0.2em] text-gold mb-3">期日演算專家系統</h1>
        <div class="h-1 w-24 bg-gold mx-auto mb-4"></div>
        <p class="text-slate-400 text-xs font-bold tracking-[0.4em] uppercase">1900 - 2100 精確天文曆法</p>
    </header>

    <main class="max-w-2xl w-full space-y-8">
        <!-- Input Section -->
        <section class="glass-card p-8 rounded-[2.5rem] shadow-2xl">
            <div class="space-y-6">
                <div class="relative">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] mb-4 text-center">請設定往生基準日期 (國曆)</label>
                    <input type="date" id="dateInput" class="w-full text-center text-4xl font-black bg-slate-900/50 border-2 border-slate-700 rounded-3xl p-6 focus:border-gold focus:ring-4 focus:ring-gold/20 outline-none transition-all date-font text-gold">
                </div>
                
                <button onclick="calculateAll()" class="w-full bg-gold text-slate-900 font-900 py-6 rounded-3xl shadow-[0_10px_30px_rgba(212,175,55,0.3)] hover:bg-yellow-500 active:scale-95 transition-all text-2xl uppercase tracking-[0.1em]">
                    <i class="fa-solid fa-gear fa-spin mr-3"></i> 啟動數理演算
                </button>
            </div>
        </section>

        <!-- Results -->
        <div id="resultArea" class="hidden space-y-8">
            
            <!-- Base Card -->
            <div class="bg-slate-900 border-2 border-gold/30 p-8 rounded-[2.5rem] relative shadow-inner">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="text-center md:text-left">
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">往生農曆基準</p>
                        <h2 id="baseLunar" class="text-4xl font-900 text-gold tracking-tighter"></h2>
                        <p id="baseSolar" class="text-sm font-mono text-slate-500 mt-2"></p>
                    </div>
                    <div id="leapIndicator" class="hidden px-5 py-2 bg-red-900/40 border border-red-500/50 rounded-2xl text-xs font-black text-red-400">
                        <i class="fa-solid fa-triangle-exclamation mr-2"></i> 往生一年內包含閏月
                    </div>
                </div>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-6 rounded-[2rem] border-b-4 border-b-blue-500">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-500">
                            <i class="fa-solid fa-7"></i>
                        </div>
                        <span class="text-xs font-black text-blue-400 uppercase tracking-widest">頭七 (D+6)</span>
                    </div>
                    <div id="res7" class="text-3xl font-black text-white date-font"></div>
                </div>
                <div class="glass-card p-6 rounded-[2rem] border-b-4 border-b-indigo-500">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-500">
                            <i class="fa-solid fa-hundred-points"></i>
                        </div>
                        <span class="text-xs font-black text-indigo-400 uppercase tracking-widest">百日 (D+99)</span>
                    </div>
                    <div id="res100" class="text-3xl font-black text-white date-font"></div>
                </div>
            </div>

            <!-- Schemes -->
            <div class="space-y-6">
                <h3 class="text-center text-xs font-black text-slate-500 tracking-[0.6em] uppercase">對年 (小祥) 智慧精算方案</h3>
                
                <!-- Scheme A -->
                <div class="glass-card p-8 rounded-[2.5rem] border-l-[12px] border-l-amber-600">
                    <div class="flex justify-between items-center mb-6">
                        <div class="px-4 py-1 bg-amber-600 text-white text-[10px] font-black rounded-full italic tracking-widest">SCHEME A</div>
                        <span id="diffA" class="text-xs font-mono text-slate-500 font-bold"></span>
                    </div>
                    <h4 class="text-xl font-black text-amber-500 mb-2">提前法 (死人無閏)</h4>
                    <div id="dateA" class="text-4xl font-black text-white date-font mb-2"></div>
                    <div id="lunarA" class="text-lg font-bold text-slate-400 mb-6"></div>
                    <div id="noteA" class="text-xs leading-relaxed text-slate-400 p-5 bg-black/30 rounded-3xl border border-white/5"></div>
                </div>

                <!-- Scheme B -->
                <div class="glass-card p-8 rounded-[2.5rem] border-l-[12px] border-l-teal-600">
                    <div class="flex justify-between items-center mb-6">
                        <div class="px-4 py-1 bg-teal-600 text-white text-[10px] font-black rounded-full italic tracking-widest">SCHEME B</div>
                        <span id="diffB" class="text-xs font-mono text-slate-500 font-bold"></span>
                    </div>
                    <h4 class="text-xl font-black text-teal-500 mb-2">定日法 (死人直)</h4>
                    <div id="dateB" class="text-4xl font-black text-white date-font mb-2"></div>
                    <div id="lunarB" class="text-lg font-bold text-slate-400 mb-6"></div>
                    <div id="noteB" class="text-xs leading-relaxed text-slate-400 p-5 bg-black/30 rounded-3xl border border-white/5"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-12 text-[10px] text-slate-600 font-bold tracking-[0.3em] uppercase text-center pb-10">
        Powered by Astronomical Algorithm & Lunar Expert System
    </footer>
</div>

<script>
    function formatDate(d) {
        const y = d.getYear();
        const m = String(d.getMonth()).padStart(2, '0');
        const day = String(d.getDay()).padStart(2, '0');
        return `${y} - ${m} - ${day}`;
    }

    function calculateAll() {
        const input = document.getElementById('dateInput').value;
        if (!input) return;

        const dateParts = input.split('-');
        const solar = Solar.fromYmd(parseInt(dateParts[0]), parseInt(dateParts[1]), parseInt(dateParts[2]));
        const lunar = solar.getLunar();
        
        document.getElementById('resultArea').classList.remove('hidden');
        document.getElementById('baseLunar').innerText = `農曆 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
        document.getElementById('baseSolar').innerText = `西元基準：${input}`;

        // 頭七 D+6
        const d7 = solar.next(6);
        document.getElementById('res7').innerText = `${d7.getYear()} - ${String(d7.getMonth()).padStart(2,'0')} - ${String(d7.getDay()).padStart(2,'0')}`;

        // 百日 D+99
        const d100 = solar.next(99);
        document.getElementById('res100').innerText = `${d100.getYear()} - ${String(d100.getMonth()).padStart(2,'0')} - ${String(d100.getDay()).padStart(2,'0')}`;

        // 判斷一年內是否有閏月
        let hasLeap = false;
        // 檢查從往生日開始的一年（365天）內農曆月份是否有閏月
        for(let i=0; i<365; i++) {
            if(solar.next(i).getLunar().getMonth() < 0) { // lunar-javascript 中，閏月月份為負數
                hasLeap = true;
                break;
            }
        }
        document.getElementById('leapIndicator').style.display = hasLeap ? 'block' : 'none';

        // 準備對年數據
        const nextYear = solar.getYear() + 1;
        const targetMonth = Math.abs(lunar.getMonth());
        const targetDay = lunar.getDay();

        // 方案 A 演算 (提前法)
        let monthA = hasLeap ? (targetMonth - 1) : targetMonth;
        let yearA = (hasLeap && targetMonth === 1) ? nextYear - 1 : nextYear;
        if(monthA === 0) { monthA = 12; }
        const resultA = getCorrectedSolar(yearA, monthA, targetDay);

        // 方案 B 演算 (定日法)
        const resultB = getCorrectedSolar(nextYear, targetMonth, targetDay);

        updateUI('A', resultA, solar, hasLeap);
        updateUI('B', resultB, solar, false);

        window.scrollTo({ top: document.getElementById('resultArea').offsetTop - 20, behavior: 'smooth' });
    }

    function getCorrectedSolar(y, m, d) {
        // 先獲取該農曆月對象
        let tempLunar = Lunar.fromYmd(y, m, 1);
        let monthDays = tempLunar.getMonthLen();
        let finalD = d;
        let corrected = false;

        if (d > monthDays) {
            finalD = monthDays;
            corrected = true;
        }

        const finalLunar = Lunar.fromYmd(y, m, finalD);
        const s = finalLunar.getSolar();

        return {
            solarStr: `${s.getYear()} - ${String(s.getMonth()).padStart(2,'0')} - ${String(s.getDay()).padStart(2,'0')}`,
            lunarStr: `農曆 ${finalLunar.getMonthInChinese()}月${finalLunar.getDayInChinese()}`,
            corrected: corrected,
            max: monthDays,
            daysDiff: 0, // 稍後計算
            solarObj: s
        };
    }

    function updateUI(type, data, startSolar, leapLogic) {
        document.getElementById(`date${type}`).innerText = data.solarStr;
        document.getElementById(`lunar${type}`).innerText = data.lunarStr;
        
        // 計算天數差
        const startJS = new Date(startSolar.getYear(), startSolar.getMonth()-1, startSolar.getDay());
        const targetJS = new Date(data.solarObj.getYear(), data.solarObj.getMonth()-1, data.solarObj.getDay());
        const diff = Math.round((targetJS - startJS) / (1000 * 60 * 60 * 24));
        document.getElementById(`diff${type}`).innerText = `${diff} 天週期`;

        let note = (type === 'A') 
            ? (leapLogic ? "偵測到往生一年內包含閏月，依「死人無閏」俗例，對年應提前一個月進行。" : "此年度區間無閏月，對年依常規農曆月份進行。")
            : "依「死人直」俗例，忽略閏月影響，固定於次年對應之農曆月日祭祀。";

        if (data.corrected) {
            note += `<br><span class="text-yellow-500 font-black tracking-tighter"><i class="fa-solid fa-circle-exclamation mr-1"></i> 大小月自動校正：</span> 因對年目標月僅有 ${data.max} 天，系統已自動將期日校準至該月最後一日。`;
        }
        document.getElementById(`note${type}`).innerHTML = note;
    }

    window.onload = function() {
        // 預設為 2025/4/27 (農曆三月三十) 進行測試
        document.getElementById('dateInput').value = "2025-04-27";
        setTimeout(calculateAll, 500);
    }
</script>

</body>
</html>
